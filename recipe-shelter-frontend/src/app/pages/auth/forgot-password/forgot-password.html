<rs-auth-shell panelTitle="Retour à la connexion" [overlayStrength]="0.32" panelText="Vous vous souvenez de votre mot de passe ?" panelCtaLabel="Connexion" panelCtaLink="/sign-in" panelImageUrl="/assets/images/auth/forgot-password-hero.webp" panelAriaLabel="Retour à la page de connexion">
    <div auth-left>
        <h1 class="rs-auth-card-title">Mot de passe oublié</h1>

        <form class="rs-form" [formGroup]="form" (ngSubmit)="onSubmit()">
            <div class="rs-field">
                <label for="email" class="rs-label">Email</label>
                <input id="email" type="email" class="rs-input" placeholder="nom@company.com" autocomplete="email" required formControlName="email" />
            </div>

            @if (email.touched && email.hasError('required')) {
            <p class="rs-field-error">L'email est obligatoire.</p>
            }

            @if (email.touched && email.hasError('email')) {
            <p class="rs-field-error">Veuillez saisir une adresse email valide.</p>
            }

            @if (apiError()) {
            <p class="rs-field-error" role="alert">
                {{ apiError() }}
            </p>
            }

            @if (apiSuccess()) {
            <p class="rs-field-success" role="status" aria-live="polite">
                {{ apiSuccess() }}
            </p>
            }

            <div class="rs-actions">
                <button type="submit" class="rs-btn rs-btn-primary" [disabled]="isSubmitting()">
                    {{ isSubmitting() ? 'Envoi du lien...' : 'Envoyer le lien' }}
                </button>
            </div>
        </form>
    </div>
</rs-auth-shell>
